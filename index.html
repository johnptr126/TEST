<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Telemetry HUD</title>
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Suppress Netlify badge injection elements */
        [data-netlify-deploy-id],
        #netlify-badge,
        .netlify-badge,
        netlify-drawer,
        iframe[src*="netlify"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* HUD Pinned to bottom-left */
        .hud-wrapper {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        /* --- VERTICALLY STACKED STATS (Solid Black = Zero CEF Artifacts) --- */
        .stats-panel {
            width: 372px; /* Matches 180px + 12px gap + 180px coordinates */
            box-sizing: border-box;
            background-color: #000000 !important;
            border: 3px solid #ffffff;
            border-radius: 0;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .label-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #d1d5db;
        }

        .key-debug {
            font-family: "Consolas", monospace;
            font-size: 9px;
            color: #6b7280;
            letter-spacing: 0;
            text-transform: none;
        }

        .stat-value {
            font-family: "Consolas", monospace;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-row.xp .stat-value { color: #58a6ff; }
        .stat-row.bxp .stat-value { color: #bc8cff; }
        .stat-row.money .stat-value { color: #3fb950; }

        .stat-row-divider {
            width: 100%;
            height: 1px;
            background: #333333;
        }

        /* --- RAW 1-BIT CV COORDINATES (Bottom Boxes) --- */
        .coords-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-card {
            background-color: #000000 !important;
            border: 4px solid #ffffff;
            border-radius: 0;
            padding: 0;
            width: 180px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
    </style>
</head>
<body>

    <div class="hud-wrapper" id="hud">
        <!-- TOP: Vertically Stacked Stats Dashboard -->
        <div class="stats-panel">
            <div class="stat-row xp">
                <div class="label-group">
                    <span class="stat-label">+XP EARNED</span>
                    <span class="key-debug" id="debug-xp-key">searching...</span>
                </div>
                <span class="stat-value" id="val-xp">+0</span>
            </div>
            <div class="stat-row-divider"></div>
            <div class="stat-row bxp">
                <div class="label-group">
                    <span class="stat-label">+BXP EARNED</span>
                    <span class="key-debug" id="debug-bxp-key">searching...</span>
                </div>
                <span class="stat-value" id="val-bxp">+0</span>
            </div>
            <div class="stat-row-divider"></div>
            <div class="stat-row money">
                <span class="stat-label">+EARNED $</span>
                <span class="stat-value" id="val-money">+$0</span>
            </div>
        </div>

        <!-- BOTTOM: Strict 1-Bit CV Template-Matching Coordinates -->
        <div class="coords-row">
            <div class="hud-card">
                <canvas id="cv-x" width="180" height="70"></canvas>
            </div>
            <div class="hud-card">
                <canvas id="cv-y" width="180" height="70"></canvas>
            </div>
        </div>
    </div>

    <script>
        const COORD_OFFSET = 10000;

        // Coordinate canvases
        const canvasX = document.getElementById('cv-x');
        const canvasY = document.getElementById('cv-y');
        const ctxX = canvasX.getContext('2d');
        const ctxY = canvasY.getContext('2d');

        // Stats UI elements
        const elXp = document.getElementById('val-xp');
        const elBxp = document.getElementById('val-bxp');
        const elMoney = document.getElementById('val-money');
        const debugXpKey = document.getElementById('debug-xp-key');
        const debugBxpKey = document.getElementById('debug-bxp-key');
        const hudEl = document.getElementById('hud');

        // Tracking stores: maps key_name -> { initial: number, current: number }
        const xpStore = {};
        let activeXpKey = null;

        const bxpStore = {};
        let activeBxpKey = null;

        let initialWallet = null;
        let lastWallet = null;
        let totalCashEarned = 0;

        // Strict 1-bit binary rasterizer for CV templates
        function renderBinarizedText(ctx, canvas, text) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 44px Consolas, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, w / 2, h / 2);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const val = (data[i] + data[i + 1] + data[i + 2]) / 3 > 128 ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Initialize coordinate displays
        renderBinarizedText(ctxX, canvasX, "10000");
        renderBinarizedText(ctxY, canvasY, "10000");

        function sendTycoon(payload) {
            window.postMessage(payload, "*");
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, "*");
            }
        }

        // Initial handshake
        setTimeout(() => {
            sendTycoon({ type: "pin" });
            sendTycoon({ type: "getData" });
        }, 300);

        // Keep polling getData every 3 seconds to ensure skill/cache updates arrive
        setInterval(() => {
            sendTycoon({ type: "getData" });
        }, 3000);

        window.addEventListener('message', (event) => {
            let msg = event.data;

            if (typeof msg === 'string') {
                try { msg = JSON.parse(msg); } catch (e) { return; }
            }

            if (!msg) return;

            const payload = msg.data ? msg.data : msg;

            if (payload.hidden !== undefined) {
                hudEl.style.display = payload.hidden ? 'none' : 'flex';
            }

            // 1. Process Coordinates (Strict 5-digit padded, 1-bit binary)
            const posX = payload.pos_x !== undefined ? Number(payload.pos_x) : null;
            const posY = payload.pos_y !== undefined ? Number(payload.pos_y) : null;

            if (posX !== null && posY !== null) {
                const displayX = String(Math.round(posX + COORD_OFFSET)).padStart(5, '0');
                const displayY = String(Math.round(posY + COORD_OFFSET)).padStart(5, '0');

                renderBinarizedText(ctxX, canvasX, displayX);
                renderBinarizedText(ctxY, canvasY, displayY);
            }

            // 2. Process Cash Earned This Session
            if (payload.wallet !== undefined) {
                const currentWallet = Number(payload.wallet);

                if (initialWallet === null) {
                    initialWallet = currentWallet;
                    lastWallet = currentWallet;
                } else {
                    const delta = currentWallet - lastWallet;
                    if (delta > 0) {
                        totalCashEarned += delta;
                        elMoney.textContent = "+$" + totalCashEarned.toLocaleString();
                    }
                    lastWallet = currentWallet;
                }
            }

            // 3. Scan & Process All XP Keys (exp_*)
            for (const key in payload) {
                if (key.startsWith("exp_") && typeof payload[key] === 'number') {
                    const val = Number(payload[key]);
                    const lk = key.toLowerCase();

                    // Check if this is a Bonus XP key
                    const isBonus = lk.includes("bonus") || lk.includes("bxp");

                    if (isBonus) {
                        if (!bxpStore[key]) {
                            bxpStore[key] = { initial: val, current: val };
                        } else {
                            bxpStore[key].current = val;
                        }
                        activeBxpKey = key;
                        debugBxpKey.textContent = key;
                        const gainedBxp = bxpStore[key].current - bxpStore[key].initial;
                        elBxp.textContent = "+" + gainedBxp.toLocaleString();
                    } else {
                        // Regular Skill XP key
                        if (!xpStore[key]) {
                            xpStore[key] = { initial: val, current: val };
                        } else {
                            xpStore[key].current = val;
                        }

                        // Prefer train / transport / conductor keys if present
                        if (!activeXpKey || lk.includes("train") || lk.includes("conduct") || lk.includes("transport")) {
                            activeXpKey = key;
                            debugXpKey.textContent = key;
                        }

                        if (activeXpKey && xpStore[activeXpKey]) {
                            const gainedXp = xpStore[activeXpKey].current - xpStore[activeXpKey].initial;
                            elXp.textContent = "+" + gainedXp.toLocaleString();
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
