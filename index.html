<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Telemetry HUD</title>
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Suppress Netlify badge elements */
        [data-netlify-deploy-id],
        #netlify-badge,
        .netlify-badge,
        netlify-drawer,
        iframe[src*="netlify"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* HUD Pinned to bottom-left */
        .hud-wrapper {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }

        /* --- STATS PANEL (rgb(80, 80, 80) Dark Slate Grey) --- */
        .stats-panel {
            width: 372px;
            box-sizing: border-box;
            background-color: rgb(80, 80, 80) !important;
            border: none;
            border-radius: 0;
            padding: 10px 16px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            pointer-events: auto;
        }

        /* Top Header Row */
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 2px;
        }

        .app-version {
            font-family: "Consolas", monospace;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .session-timer {
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f3f4f6;
            text-align: center;
        }

        .btn-reset {
            background: #4b5563;
            border: 1px solid #6b7280;
            color: #f9fafb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            user-select: none;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .btn-reset:hover {
            background: #ef4444;
            border-color: #dc2626;
            color: #ffffff;
        }

        .btn-reset:active {
            transform: scale(0.96);
        }

        /* Column Labels Sub-Header */
        .columns-header {
            display: flex;
            align-items: center;
            width: 100%;
            font-family: "Consolas", monospace;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #9ca3af;
            text-transform: uppercase;
            border-bottom: 1px solid #6b7280;
            padding-bottom: 3px;
            margin-bottom: 2px;
        }

        .col-h-left { width: 145px; flex-shrink: 0; }
        .col-h-mid { flex: 1; text-align: center; }
        .col-h-right { width: 85px; flex-shrink: 0; text-align: right; }

        /* 3-Column horizontal rows */
        .stat-row {
            display: flex;
            align-items: baseline;
            width: 100%;
        }

        .stat-label {
            width: 145px;
            flex-shrink: 0;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #e5e7eb;
            white-space: nowrap;
        }

        .stat-value {
            flex: 1;
            text-align: center;
            font-family: "Consolas", monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-rate {
            width: 85px;
            flex-shrink: 0;
            text-align: right;
            font-family: "Consolas", monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f3f4f6;
        }

        /* Accent styling */
        .stat-row.xp .stat-value { color: #60a5fa; }
        .stat-row.bxp .stat-value { color: #c084fc; }
        .stat-row.bxp-profit .stat-value { color: #a855f7; }
        .stat-row.total-tbxp .stat-value { color: #d8b4fe; }
        .stat-row.pxp .stat-value { color: #38bdf8; }
        .stat-row.pbxp .stat-value { color: #e879f9; }
        .stat-row.pbxp-profit .stat-value { color: #d946ef; }
        .stat-row.total-pbxp .stat-value { color: #f0abfc; }
        .stat-row.stops .stat-value { color: #fbbf24; }
        .stat-row.avg-time .stat-value { color: #fde047; }
        .stat-row.streaks .stat-value { color: #f59e0b; }
        .stat-row.money .stat-value { color: #4ade80; }
        .stat-row.total-bxp-money .stat-value { color: #34d399; }
        .stat-row.grand-total .stat-value { color: #22c55e; }

        .stat-row-divider {
            width: 100%;
            height: 1px;
            background: #6b7280;
            margin: 1px 0;
        }

        .stat-row-divider.thick {
            background: #9ca3af;
            height: 2px;
        }

        /* --- RAW 1-BIT CV COORDINATES (Bottom Boxes - Untouched) --- */
        .coords-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-card {
            background-color: #000000 !important;
            border: 4px solid #ffffff;
            border-radius: 0;
            padding: 0;
            width: 180px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
    </style>
</head>
<body>

    <div class="hud-wrapper" id="hud">
        <!-- TOP: 3-Column Stats Dashboard -->
        <div class="stats-panel">
            <div class="stats-header">
                <span class="app-version">v32</span>
                <span class="session-timer" id="session-timer">00:00:00</span>
                <button class="btn-reset" id="btn-reset" tabindex="-1" title="Reset current session telemetry">RESET</button>
            </div>

            <!-- Column Titles: METRIC | SESSION | /H -->
            <div class="columns-header">
                <span class="col-h-left">METRIC</span>
                <span class="col-h-mid">SESSION</span>
                <span class="col-h-right">/H</span>
            </div>

            <!-- 1. TRAIN XP -->
            <div class="stat-row xp">
                <span class="stat-label">TRAIN XP</span>
                <span class="stat-value" id="val-xp">0</span>
                <span class="stat-rate" id="rate-xp">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 2. TRAIN BXP -->
            <div class="stat-row bxp">
                <span class="stat-label">TRAIN BXP</span>
                <span class="stat-value" id="val-bxp">0</span>
                <span class="stat-rate" id="rate-bxp">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 3. TRAIN BXP PROFIT -->
            <div class="stat-row bxp-profit">
                <span class="stat-label">TRAIN BXP PROFIT</span>
                <span class="stat-value" id="val-tbxp-profit">0</span>
                <span class="stat-rate" id="rate-tbxp-profit">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 4. TOTAL TRAIN BXP -->
            <div class="stat-row total-tbxp">
                <span class="stat-label">TOTAL TRAIN BXP</span>
                <span class="stat-value" id="val-total-tbxp">0</span>
                <span class="stat-rate" style="color: #9ca3af;">-</span>
            </div>
            <div class="stat-row-divider thick"></div>

            <!-- 5. PLAYER XP -->
            <div class="stat-row pxp">
                <span class="stat-label">PLAYER XP</span>
                <span class="stat-value" id="val-pxp">0</span>
                <span class="stat-rate" id="rate-pxp">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 6. PLAYER BXP -->
            <div class="stat-row pbxp">
                <span class="stat-label">PLAYER BXP</span>
                <span class="stat-value" id="val-pbxp">0</span>
                <span class="stat-rate" id="rate-pbxp">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 7. PLAYER BXP PROFIT -->
            <div class="stat-row pbxp-profit">
                <span class="stat-label">PLAYER BXP PROFIT</span>
                <span class="stat-value" id="val-pbxp-profit">0</span>
                <span class="stat-rate" id="rate-pbxp-profit">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 8. TOTAL PLAYER BXP -->
            <div class="stat-row total-pbxp">
                <span class="stat-label">TOTAL PLAYER BXP</span>
                <span class="stat-value" id="val-total-pbxp">0</span>
                <span class="stat-rate" style="color: #9ca3af;">-</span>
            </div>
            <div class="stat-row-divider thick"></div>

            <!-- 9. STOPS -->
            <div class="stat-row stops">
                <span class="stat-label">STOPS</span>
                <span class="stat-value" id="val-stops">0</span>
                <span class="stat-rate" id="rate-stops">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 10. AVG TIME (6 STOPS) -->
            <div class="stat-row avg-time">
                <span class="stat-label">AVG TIME (6 STOPS)</span>
                <span class="stat-value" id="val-avg-6">--:--</span>
                <span class="stat-rate" style="color: #9ca3af;">-</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 11. AVG TIME (12 STOPS) -->
            <div class="stat-row avg-time">
                <span class="stat-label">AVG TIME (12 STOPS)</span>
                <span class="stat-value" id="val-avg-12">--:--</span>
                <span class="stat-rate" style="color: #9ca3af;">-</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 12. STREAKS EARNED -->
            <div class="stat-row streaks">
                <span class="stat-label">STREAKS EARNED</span>
                <span class="stat-value" id="val-streaks">0</span>
                <span class="stat-rate" id="rate-streaks">0</span>
            </div>
            <div class="stat-row-divider thick"></div>

            <!-- 13. $$$ --> <div class="stat-row money"> <span class="stat-label">$$$</span>
                <span class="stat-value" id="val-money">0</span>
                <span class="stat-rate" id="rate-money">0</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- 14. TOTAL BXP $ -->
            <div class="stat-row total-bxp-money">
                <span class="stat-label">TOTAL BXP $</span> <span class="stat-value" id="val-total-bxp-money">0</span> <span class="stat-rate" id="rate-total-bxp-money">0</span> </div> <div class="stat-row-divider thick"></div>              <!-- 15. TOTAL $$$ --> <div class="stat-row grand-total"> <span class="stat-label">TOTAL $$$</span>
                <span class="stat-value" id="val-grand-total">0</span>
                <span class="stat-rate" id="rate-grand-total">0</span>
            </div>
        </div>

        <!-- BOTTOM: Strict 1-Bit CV Template-Matching Coordinates -->
        <div class="coords-row">
            <div class="hud-card">
                <canvas id="cv-x" width="180" height="70"></canvas>
            </div>
            <div class="hud-card">
                <canvas id="cv-y" width="180" height="70"></canvas>
            </div>
        </div>
    </div>

    <script>
        const COORD_OFFSET = 10000;

        // Telemetry Keys
        const JOB_EXP_KEY = "exp_train_train";
        const JOB_BXP_KEY = "exp_token_a|train|train";
        const PLAYER_BXP_KEY = "exp_token_a|player|player";

        // Stop payout bracket & debounce window
        const STOP_MIN_PAYOUT = 100000;
        const STOP_MAX_PAYOUT = 5000000;
        const STOP_DEBOUNCE_MS = 5000;
        let lastStopTimestamp = 0;

        // BXP Spend filter (ignore bulk sales > 1000)
        const MAX_JOB_BXP_SPEND = 1000;

        // Post-Tax Token Prices
        const TRAIN_BXP_VAL = 850;  // $1,000 - 15%
        const PLAYER_BXP_VAL = 425; // $500 - 15%

        // Compact number formatter
        function formatCompact(num) {
            if (num === null || num === undefined || isNaN(num)) return "0";
            const isNegative = num < 0;
            const abs = Math.abs(num);

            if (abs < 20000) {
                return (isNegative ? "-" : "") + Math.round(abs).toString();
            }

            const tiers = [
                { limit: 1e12, suffix: 't' },
                { limit: 1e9,  suffix: 'b' },
                { limit: 1e6,  suffix: 'm' },
                { limit: 1e3,  suffix: 'k' }
            ];

            for (let i = 0; i < tiers.length; i++) {
                const tier = tiers[i];
                if (abs >= tier.limit) {
                    const scaled = abs / tier.limit;
                    let formatted = scaled >= 100 ? scaled.toFixed(0) : (scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2));
                    formatted = parseFloat(formatted).toString();
                    return (isNegative ? "-" : "") + formatted + tier.suffix;
                }
            }

            return (isNegative ? "-" : "") + Math.round(abs).toString();
        }

        // Formats milliseconds into clean mm:ss (or hh:mm:ss if >= 1hr)
        function formatDuration(ms) {
            if (!ms || ms <= 0 || isNaN(ms)) return "--:--";
            const totalSec = Math.round(ms / 1000);
            const hrs = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;

            if (hrs > 0) {
                return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Canvases
        const canvasX = document.getElementById('cv-x');
        const canvasY = document.getElementById('cv-y');
        const ctxX = canvasX.getContext('2d');
        const ctxY = canvasY.getContext('2d');

        // Stats UI elements
        const elTimer = document.getElementById('session-timer');
        
        // Train Section
        const elXp = document.getElementById('val-xp');
        const elXpRate = document.getElementById('rate-xp');
        const elBxp = document.getElementById('val-bxp');
        const elBxpRate = document.getElementById('rate-bxp');
        const elTbxpProfit = document.getElementById('val-tbxp-profit');
        const elTbxpProfitRate = document.getElementById('rate-tbxp-profit');
        const elTotalTbxp = document.getElementById('val-total-tbxp');

        // Player Section
        const elPxp = document.getElementById('val-pxp');
        const elPxpRate = document.getElementById('rate-pxp');
        const elPbxp = document.getElementById('val-pbxp');
        const elPbxpRate = document.getElementById('rate-pbxp');
        const elPbxpProfit = document.getElementById('val-pbxp-profit');
        const elPbxpProfitRate = document.getElementById('rate-pbxp-profit');
        const elTotalPbxp = document.getElementById('val-total-pbxp');

        // Stops, Timers & Streaks
        const elStops = document.getElementById('val-stops');
        const elStopsRate = document.getElementById('rate-stops');
        const elAvg6 = document.getElementById('val-avg-6');
        const elAvg12 = document.getElementById('val-avg-12');
        const elStreaks = document.getElementById('val-streaks');
        const elStreaksRate = document.getElementById('rate-streaks');

        // Revenue Section
        const elMoney = document.getElementById('val-money');
        const elMoneyRate = document.getElementById('rate-money');
        const elTotalBxpMoney = document.getElementById('val-total-bxp-money');
        const elTotalBxpMoneyRate = document.getElementById('rate-total-bxp-money');
        const elGrandTotal = document.getElementById('val-grand-total');
        const elGrandTotalRate = document.getElementById('rate-grand-total');

        const btnReset = document.getElementById('btn-reset');
        const hudEl = document.getElementById('hud');

        // Session Tracking State
        let sessionStartTime = null;

        // Train Tracking
        let startXp = null;
        let currentXp = 0;
        let gainedXp = 0;
        let lastBxp = null;
        let sessionBxp = 0;

        // Player Tracking
        let startPxp = null;
        let currentPxp = 0;
        let gainedPxp = 0;
        let lastPbxp = null;
        let sessionPbxp = 0;

        // Stops & Cash
        let stopCount = 0;
        let lastWallet = null;
        let totalCashEarned = 0;

        function sendTycoon(payload) {
            window.postMessage(payload, "*");
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, "*");
            }
        }

        btnReset.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        // Reset Handler
        btnReset.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (currentXp > 0) startXp = currentXp;
            if (currentPxp > 0) startPxp = currentPxp;

            gainedXp = 0;
            sessionBxp = 0;
            gainedPxp = 0;
            sessionPbxp = 0;
            totalCashEarned = 0;
            stopCount = 0;
            lastStopTimestamp = 0;

            sessionStartTime = null;
            elTimer.textContent = "00:00:00";
            elAvg6.textContent = "--:--";
            elAvg12.textContent = "--:--";

            [elXp, elXpRate, elBxp, elBxpRate, elTbxpProfit, elTbxpProfitRate,
             elPxp, elPxpRate, elPbxp, elPbxpRate, elPbxpProfit, elPbxpProfitRate,
             elStops, elStopsRate, elStreaks, elStreaksRate, elMoney, elMoneyRate, 
             elTotalBxpMoney, elTotalBxpMoneyRate, elGrandTotal, elGrandTotalRate].forEach(el => el.textContent = "0");

            btnReset.blur();
            if (document.activeElement) document.activeElement.blur();
            window.focus();
            sendTycoon({ type: "pin" });
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.keyCode === 27) {
                if (document.activeElement) document.activeElement.blur();
                window.focus();
                sendTycoon({ type: 'pin' });
            }
        });

        // 1-bit rasterizer for CV coordinate cards
        function renderBinarizedText(ctx, canvas, text) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 44px Consolas, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, w / 2, h / 2);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const val = (data[i] + data[i + 1] + data[i + 2]) / 3 > 128 ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        renderBinarizedText(ctxX, canvasX, "10000");
        renderBinarizedText(ctxY, canvasY, "10000");

        setTimeout(() => {
            sendTycoon({ type: "pin" });
            sendTycoon({ type: "getData" });
        }, 300);

        setInterval(() => {
            try {
                sendTycoon({ 
                    type: "getNamedData", 
                    keys: [
                        JOB_EXP_KEY, 
                        JOB_BXP_KEY,
                        PLAYER_BXP_KEY,
                        "exp_overall",
                        "exp_physical_strength",
                        "inventory", 
                        "wallet", 
                        "pos_x", 
                        "pos_y"
                    ] 
                });
                sendTycoon({ type: "getData" });
            } catch (e) {}
        }, 1000);

        function updateCombinedRevenue() {
            const trainProfit = sessionBxp * TRAIN_BXP_VAL;
            const playerProfit = sessionPbxp * PLAYER_BXP_VAL;
            const totalBxpProf = trainProfit + playerProfit;
            const grandTotal = totalCashEarned + totalBxpProf;

            elTotalBxpMoney.textContent = formatCompact(totalBxpProf);
            elGrandTotal.textContent = formatCompact(grandTotal);
        }

        function updateHourlyRatesAndTimer() {
            if (!sessionStartTime) return;

            const elapsedMs = Date.now() - sessionStartTime;
            const totalSec = Math.floor(elapsedMs / 1000);

            const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSec % 60).padStart(2, '0');
            elTimer.textContent = `${hrs}:${mins}:${secs}`;

            // Average Stop Pace Calculation
            if (stopCount > 0) {
                const msPerStop = elapsedMs / stopCount;
                elAvg6.textContent = formatDuration(msPerStop * 6);
                elAvg12.textContent = formatDuration(msPerStop * 12);
            } else {
                elAvg6.textContent = "--:--";
                elAvg12.textContent = "--:--";
            }

            const elapsedHours = elapsedMs / 3600000;
            if (elapsedHours <= 0) return;

            // Train Section Rates
            elXpRate.textContent = formatCompact(gainedXp / elapsedHours);
            elBxpRate.textContent = formatCompact(sessionBxp / elapsedHours);
            elTbxpProfitRate.textContent = formatCompact((sessionBxp * TRAIN_BXP_VAL) / elapsedHours);

            // Player Section Rates
            elPxpRate.textContent = formatCompact(gainedPxp / elapsedHours);
            elPbxpRate.textContent = formatCompact(sessionPbxp / elapsedHours);
            elPbxpProfitRate.textContent = formatCompact((sessionPbxp * PLAYER_BXP_VAL) / elapsedHours);

            // Stops & Streaks Rates
            elStopsRate.textContent = formatCompact(Math.round(stopCount / elapsedHours));
            
            const streaksCount = Math.floor(stopCount / 6);
            const streaksPerHour = (stopCount / 6) / elapsedHours;
            elStreaks.textContent = formatCompact(streaksCount);
            elStreaksRate.textContent = (streaksPerHour >= 10 ? streaksPerHour.toFixed(1) : streaksPerHour.toFixed(2)).replace(/\.?0+$/, "");

            // Revenue Rates
            const totalBxpProf = (sessionBxp * TRAIN_BXP_VAL) + (sessionPbxp * PLAYER_BXP_VAL);
            const grandTotalProf = totalCashEarned + totalBxpProf;

            elMoneyRate.textContent = formatCompact(totalCashEarned / elapsedHours);
            elTotalBxpMoneyRate.textContent = formatCompact(totalBxpProf / elapsedHours);
            elGrandTotalRate.textContent = formatCompact(grandTotalProf / elapsedHours);
        }
        setInterval(updateHourlyRatesAndTimer, 1000);

        window.addEventListener('message', (event) => {
            let msg = event.data;

            if (typeof msg === 'string') {
                try { msg = JSON.parse(msg); } catch (e) { return; }
            }

            if (!msg) return;
            const payload = (msg.type === 'data' && msg.data) ? msg.data : (msg.data ? msg.data : msg);

            if (payload.hidden !== undefined) {
                hudEl.style.display = payload.hidden ? 'none' : 'flex';
            }

            // Coordinates
            const posX = payload.pos_x !== undefined ? Number(payload.pos_x) : null;
            const posY = payload.pos_y !== undefined ? Number(payload.pos_y) : null;

            if (posX !== null && posY !== null) {
                const displayX = String(Math.round(posX + COORD_OFFSET)).padStart(5, '0');
                const displayY = String(Math.round(posY + COORD_OFFSET)).padStart(5, '0');

                renderBinarizedText(ctxX, canvasX, displayX);
                renderBinarizedText(ctxY, canvasY, displayY);
            }

            // Wallet & Filtered Stops
            if (payload.wallet !== undefined) {
                const currentWallet = Number(payload.wallet);
                if (lastWallet !== null) {
                    const delta = currentWallet - lastWallet;
                    if (delta > 0) {
                        totalCashEarned += delta;
                        elMoney.textContent = formatCompact(totalCashEarned);

                        const now = Date.now();
                        if (delta >= STOP_MIN_PAYOUT && delta <= STOP_MAX_PAYOUT) {
                            if (now - lastStopTimestamp >= STOP_DEBOUNCE_MS) {
                                stopCount++;
                                lastStopTimestamp = now;
                                elStops.textContent = String(stopCount);

                                if (sessionStartTime === null) {
                                    sessionStartTime = now;
                                }

                                elStreaks.textContent = formatCompact(Math.floor(stopCount / 6));
                            }
                        }

                        updateCombinedRevenue();
                        updateHourlyRatesAndTimer();
                    }
                }
                lastWallet = currentWallet;
            }

            // Train XP
            const rawXp = payload[JOB_EXP_KEY];
            if (typeof rawXp === 'number' && rawXp > 0) {
                if (startXp === null) {
                    startXp = rawXp;
                    currentXp = rawXp;
                } else if (rawXp > currentXp) {
                    currentXp = rawXp;
                    gainedXp = currentXp - startXp;
                    elXp.textContent = formatCompact(gainedXp);
                    updateHourlyRatesAndTimer();
                } else if (rawXp < currentXp) {
                    currentXp = rawXp;
                }
            }

            // Player XP
            const rawPxp = payload.exp_overall !== undefined ? payload.exp_overall : payload.exp_physical_strength;
            if (typeof rawPxp === 'number' && rawPxp > 0) {
                if (startPxp === null) {
                    startPxp = rawPxp;
                    currentPxp = rawPxp;
                } else if (rawPxp > currentPxp) {
                    currentPxp = rawPxp;
                    gainedPxp = currentPxp - startPxp;
                    elPxp.textContent = formatCompact(gainedPxp);
                    updateHourlyRatesAndTimer();
                } else if (rawPxp < currentPxp) {
                    currentPxp = rawPxp;
                }
            }

            // Inventory Extraction
            let inv = null;
            if (payload.inventory) {
                try {
                    inv = (typeof payload.inventory === 'string') ? JSON.parse(payload.inventory) : payload.inventory;
                } catch (e) {}
            }

            // Train BXP
            let rawBxp = payload[JOB_BXP_KEY];
            if ((rawBxp === undefined || rawBxp === null) && inv && inv[JOB_BXP_KEY] !== undefined) {
                rawBxp = inv[JOB_BXP_KEY];
            }

            if (rawBxp !== undefined && rawBxp !== null) {
                let bxpNum = (typeof rawBxp === 'object') ? Number(rawBxp.amount) : Number(rawBxp);
                if (!isNaN(bxpNum)) {
                    elTotalTbxp.textContent = formatCompact(bxpNum);

                    if (lastBxp !== null) {
                        const delta = bxpNum - lastBxp;
                        if (delta > 0) {
                            sessionBxp += delta;
                        } else if (delta < 0 && Math.abs(delta) <= MAX_JOB_BXP_SPEND) {
                            sessionBxp += delta;
                        }
                        elBxp.textContent = formatCompact(sessionBxp);
                        elTbxpProfit.textContent = formatCompact(sessionBxp * TRAIN_BXP_VAL);
                        updateCombinedRevenue();
                        updateHourlyRatesAndTimer();
                    }
                    lastBxp = bxpNum;
                }
            }

            // Player BXP
            let rawPbxp = payload[PLAYER_BXP_KEY];
            if ((rawPbxp === undefined || rawPbxp === null) && inv) {
                if (inv[PLAYER_BXP_KEY] !== undefined) {
                    rawPbxp = inv[PLAYER_BXP_KEY];
                } else if (inv["exp_token_a|physical|physical"] !== undefined) {
                    rawPbxp = inv["exp_token_a|physical|physical"];
                }
            }

            if (rawPbxp !== undefined && rawPbxp !== null) {
                let pbxpNum = (typeof rawPbxp === 'object') ? Number(rawPbxp.amount) : Number(rawPbxp);
                if (!isNaN(pbxpNum)) {
                    elTotalPbxp.textContent = formatCompact(pbxpNum);

                    if (lastPbxp !== null) {
                        const delta = pbxpNum - lastPbxp;
                        if (delta > 0) {
                            sessionPbxp += delta;
                        } else if (delta < 0 && Math.abs(delta) <= MAX_JOB_BXP_SPEND) {
                            sessionPbxp += delta;
                        }
                        elPbxp.textContent = formatCompact(sessionPbxp);
                        elPbxpProfit.textContent = formatCompact(sessionPbxp * PLAYER_BXP_VAL);
                        updateCombinedRevenue();
                        updateHourlyRatesAndTimer();
                    }
                    lastPbxp = pbxpNum;
                }
            }
        });
    </script>
</body>
</html>
