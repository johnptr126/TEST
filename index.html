<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Telemetry HUD</title>
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Suppress Netlify badge elements */
        [data-netlify-deploy-id],
        #netlify-badge,
        .netlify-badge,
        netlify-drawer,
        iframe[src*="netlify"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* HUD Pinned to bottom-left */
        .hud-wrapper {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        /* --- VERTICALLY STACKED STATS (Light Grey, No Border) --- */
        .stats-panel {
            width: 372px; /* Matches 180px + 12px gap + 180px coordinates */
            box-sizing: border-box;
            background-color: #d1d5db !important; /* Solid light grey */
            border: none;
            border-radius: 0;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .stat-label {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #1f2937; /* Dark charcoal text for readability on light grey */
        }

        .stat-value {
            font-family: "Consolas", monospace;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Value text colors on light grey background */
        .stat-row.xp .stat-value { color: #1d4ed8; }
        .stat-row.bxp .stat-value { color: #7e22ce; }
        .stat-row.stops .stat-value { color: #b45309; }
        .stat-row.streak .stat-value { color: #ea580c; }
        .stat-row.money .stat-value { color: #15803d; }

        .stat-row-divider {
            width: 100%;
            height: 1px;
            background: #9ca3af; /* Soft divider */
        }

        /* --- RAW 1-BIT CV COORDINATES (Bottom Boxes - Untouched) --- */
        .coords-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-card {
            background-color: #000000 !important;
            border: 4px solid #ffffff;
            border-radius: 0;
            padding: 0;
            width: 180px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
    </style>
</head>
<body>

    <div class="hud-wrapper" id="hud">
        <!-- TOP: Vertically Stacked Stats Dashboard -->
        <div class="stats-panel">
            <div class="stat-row xp">
                <span class="stat-label">XP</span>
                <span class="stat-value" id="val-xp">0</span>
            </div>
            <div class="stat-row-divider"></div>
            <div class="stat-row bxp">
                <span class="stat-label">BXP</span>
                <span class="stat-value" id="val-bxp">0</span>
            </div>
            <div class="stat-row-divider"></div>
            <div class="stat-row stops">
                <span class="stat-label">STOPS</span>
                <span class="stat-value" id="val-stops">0</span>
            </div>
            <div class="stat-row-divider"></div>
            <div class="stat-row streak">
                <span class="stat-label">STREAK</span>
                <span class="stat-value" id="val-streak">0</span>
            </div>
            <div class="stat-row-divider"></div>
            <div class="stat-row money">
                <span class="stat-label">$$$</span>
                <span class="stat-value" id="val-money">+$0</span>
            </div>
        </div>

        <!-- BOTTOM: Strict 1-Bit CV Template-Matching Coordinates -->
        <div class="coords-row">
            <div class="hud-card">
                <canvas id="cv-x" width="180" height="70"></canvas>
            </div>
            <div class="hud-card">
                <canvas id="cv-y" width="180" height="70"></canvas>
            </div>
        </div>
    </div>

    <script>
        const COORD_OFFSET = 10000;
        const JOB_EXP_KEY = "exp_train_train";
        const JOB_BXP_KEY = "exp_token_a|train|train";

        // Canvases
        const canvasX = document.getElementById('cv-x');
        const canvasY = document.getElementById('cv-y');
        const ctxX = canvasX.getContext('2d');
        const ctxY = canvasY.getContext('2d');

        // Stats UI elements
        const elXp = document.getElementById('val-xp');
        const elBxp = document.getElementById('val-bxp');
        const elStops = document.getElementById('val-stops');
        const elStreak = document.getElementById('val-streak');
        const elMoney = document.getElementById('val-money');
        const hudEl = document.getElementById('hud');

        // Session Tracking State
        let startXp = null;
        let currentXp = 0;
        let stopCount = 0;

        let startBxp = null;
        let currentBxp = 0;

        let currentStreak = 0;

        let initialWallet = null;
        let lastWallet = null;
        let totalCashEarned = 0;

        // Strict 1-bit binary rasterizer for CV templates
        function renderBinarizedText(ctx, canvas, text) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 44px Consolas, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, w / 2, h / 2);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const val = (data[i] + data[i + 1] + data[i + 2]) / 3 > 128 ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Initialize coordinate displays
        renderBinarizedText(ctxX, canvasX, "10000");
        renderBinarizedText(ctxY, canvasY, "10000");

        function sendTycoon(payload) {
            window.postMessage(payload, "*");
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, "*");
            }
        }

        // Handshake
        setTimeout(() => {
            sendTycoon({ type: "pin" });
            sendTycoon({ type: "getData" });
        }, 300);

        // Targeted polling every 1.5s
        setInterval(() => {
            try {
                sendTycoon({ 
                    type: "getNamedData", 
                    keys: [
                        JOB_EXP_KEY, 
                        JOB_BXP_KEY, 
                        "train_streak",
                        "streak", 
                        "inventory", 
                        "wallet", 
                        "pos_x", 
                        "pos_y"
                    ] 
                });
                sendTycoon({ type: "getData" });
            } catch (e) {}
        }, 1500);

        window.addEventListener('message', (event) => {
            let msg = event.data;

            if (typeof msg === 'string') {
                try { msg = JSON.parse(msg); } catch (e) { return; }
            }

            if (!msg) return;
            const payload = (msg.type === 'data' && msg.data) ? msg.data : (msg.data ? msg.data : msg);

            if (payload.hidden !== undefined) {
                hudEl.style.display = payload.hidden ? 'none' : 'flex';
            }

            // 1. Coordinates (Zero-latency)
            const posX = payload.pos_x !== undefined ? Number(payload.pos_x) : null;
            const posY = payload.pos_y !== undefined ? Number(payload.pos_y) : null;

            if (posX !== null && posY !== null) {
                const displayX = String(Math.round(posX + COORD_OFFSET)).padStart(5, '0');
                const displayY = String(Math.round(posY + COORD_OFFSET)).padStart(5, '0');

                renderBinarizedText(ctxX, canvasX, displayX);
                renderBinarizedText(ctxY, canvasY, displayY);
            }

            // 2. Cash Earned (keeps commas via toLocaleString)
            if (payload.wallet !== undefined) {
                const currentWallet = Number(payload.wallet);
                if (initialWallet === null) {
                    initialWallet = currentWallet;
                    lastWallet = currentWallet;
                } else {
                    const delta = currentWallet - lastWallet;
                    if (delta > 0) {
                        totalCashEarned += delta;
                        elMoney.textContent = "+$" + Math.round(totalCashEarned).toLocaleString();
                    }
                    lastWallet = currentWallet;
                }
            }

            // 3. XP & Stop Counting (raw string, no commas)
            const rawXp = payload[JOB_EXP_KEY];
            if (typeof rawXp === 'number') {
                if (startXp === null || startXp === 0) {
                    startXp = rawXp;
                    currentXp = rawXp;
                } else if (rawXp > currentXp) {
                    stopCount++;
                    currentXp = rawXp;
                    elStops.textContent = String(stopCount);

                    if (currentStreak === 0) {
                        elStreak.textContent = String(stopCount);
                    }
                } else if (rawXp < currentXp) {
                    currentXp = rawXp;
                }

                const gainedXp = Math.round(currentXp - startXp);
                elXp.textContent = String(gainedXp);
            }

            // 4. BXP Tokens (raw string, no commas)
            let rawBxp = payload[JOB_BXP_KEY];
            if (!rawBxp && payload.inventory) {
                try {
                    let inv = (typeof payload.inventory === 'string') ? JSON.parse(payload.inventory) : payload.inventory;
                    if (inv && inv[JOB_BXP_KEY]) {
                        rawBxp = inv[JOB_BXP_KEY];
                    }
                } catch (e) {}
            }

            if (rawBxp !== undefined && rawBxp !== null) {
                let bxpNum = (typeof rawBxp === 'object') ? Number(rawBxp.amount) : Number(rawBxp);
                if (!isNaN(bxpNum)) {
                    if (startBxp === null) {
                        startBxp = bxpNum;
                        currentBxp = bxpNum;
                    } else {
                        currentBxp = bxpNum;
                    }
                    const gainedBxp = Math.round(currentBxp - startBxp);
                    elBxp.textContent = String(gainedBxp);
                }
            }

            // 5. Streak Detection (Server key scanner with session fallback)
            let streakVal = null;
            if (payload.train_streak !== undefined) {
                streakVal = payload.train_streak;
            } else if (payload.streak !== undefined) {
                streakVal = payload.streak;
            } else {
                for (const key in payload) {
                    if (key.includes("streak") && typeof payload[key] === "number") {
                        streakVal = payload[key];
                        break;
                    }
                }
            }

            if (streakVal !== null) {
                currentStreak = Math.round(Number(streakVal));
                elStreak.textContent = String(currentStreak);
            }
        });
    </script>
</body>
</html>
