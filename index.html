<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Telemetry HUD</title>
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Suppress Netlify badge elements */
        [data-netlify-deploy-id],
        #netlify-badge,
        .netlify-badge,
        netlify-drawer,
        iframe[src*="netlify"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* HUD Pinned to bottom-left */
        .hud-wrapper {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        /* --- VERTICALLY STACKED STATS (Light Grey, 3-Column Horizontal Layout) --- */
        .stats-panel {
            width: 372px;
            box-sizing: border-box;
            background-color: #d1d5db !important;
            border: none;
            border-radius: 0;
            padding: 12px 18px 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        /* Top Header Row for Controls and Timer */
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: -4px;
        }

        .session-timer {
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #374151;
        }

        .btn-reset {
            background: #9ca3af;
            border: none;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            user-select: none;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .btn-reset:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-reset:active {
            transform: scale(0.96);
        }

        /* 3-Column horizontal row: [Label (Left)] --- [Session Value (Center)] --- [/h Rate (Right)] */
        .stat-row {
            display: flex;
            align-items: baseline;
            width: 100%;
        }

        .stat-label {
            width: 75px;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #1f2937;
        }

        /* Current session total centered */
        .stat-value {
            flex: 1;
            text-align: center;
            font-family: "Consolas", monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* /h value on the right */
        .stat-rate {
            width: 130px;
            flex-shrink: 0;
            text-align: right;
            font-family: "Consolas", monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #111827;
        }

        /* Value text colors on light grey background */
        .stat-row.xp .stat-value { color: #1d4ed8; }
        .stat-row.bxp .stat-value { color: #7e22ce; }
        .stat-row.stops .stat-value { color: #b45309; }
        .stat-row.money .stat-value { color: #15803d; }

        .stat-row-divider {
            width: 100%;
            height: 1px;
            background: #9ca3af;
        }

        /* --- RAW 1-BIT CV COORDINATES (Bottom Boxes - Untouched) --- */
        .coords-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-card {
            background-color: #000000 !important;
            border: 4px solid #ffffff;
            border-radius: 0;
            padding: 0;
            width: 180px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
    </style>
</head>
<body>

    <div class="hud-wrapper" id="hud">
        <!-- TOP: 3-Column Stats Dashboard -->
        <div class="stats-panel">
            <div class="stats-header">
                <span class="session-timer" id="session-timer">00:00:00</span>
                <button class="btn-reset" id="btn-reset" tabindex="-1" title="Reset current session telemetry">RESET</button>
            </div>

            <!-- XP -->
            <div class="stat-row xp">
                <span class="stat-label">XP</span>
                <span class="stat-value" id="val-xp">0</span>
                <span class="stat-rate" id="rate-xp">0/h</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- BXP (Net Session Balance) -->
            <div class="stat-row bxp">
                <span class="stat-label">BXP</span>
                <span class="stat-value" id="val-bxp">0</span>
                <span class="stat-rate" id="rate-bxp">0/h</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- STOPS -->
            <div class="stat-row stops">
                <span class="stat-label">STOPS</span>
                <span class="stat-value" id="val-stops">0</span>
                <span class="stat-rate" id="rate-stops">0/h</span>
            </div>
            <div class="stat-row-divider"></div>

            <!-- $$$ --> <div class="stat-row money"> <span class="stat-label">$$$</span>
                <span class="stat-value" id="val-money">0</span>
                <span class="stat-rate" id="rate-money">0/h</span>
            </div>
        </div>

        <!-- BOTTOM: Strict 1-Bit CV Template-Matching Coordinates -->
        <div class="coords-row">
            <div class="hud-card">
                <canvas id="cv-x" width="180" height="70"></canvas>
            </div>
            <div class="hud-card">
                <canvas id="cv-y" width="180" height="70"></canvas>
            </div>
        </div>
    </div>

    <script>
        const COORD_OFFSET = 10000;
        const JOB_EXP_KEY = "exp_train_train";
        const JOB_BXP_KEY = "exp_token_a|train|train";

        // Compact number formatter: preserves negative signs and formats k, m, b, t
        function formatCompact(num) {
            const isNegative = num < 0;
            const abs = Math.abs(num);

            if (abs < 20000) {
                return (isNegative ? "-" : "") + Math.round(abs);
            }

            const tiers = [
                { limit: 1e12, suffix: 't' },
                { limit: 1e9,  suffix: 'b' },
                { limit: 1e6,  suffix: 'm' },
                { limit: 1e3,  suffix: 'k' }
            ];

            for (const tier of tiers) {
                if (abs >= tier.limit) {
                    const scaled = abs / tier.limit;
                    let formatted = scaled >= 100 ? scaled.toFixed(0) : (scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2));
                    formatted = formatted.replace(/\.?0+$/, "");
                    return (isNegative ? "-" : "") + formatted + tier.suffix;
                }
            }

            return (isNegative ? "-" : "") + Math.round(abs);
        }

        // Canvases
        const canvasX = document.getElementById('cv-x');
        const canvasY = document.getElementById('cv-y');
        const ctxX = canvasX.getContext('2d');
        const ctxY = canvasY.getContext('2d');

        // Stats UI elements
        const elTimer = document.getElementById('session-timer');
        const elXp = document.getElementById('val-xp');
        const elXpRate = document.getElementById('rate-xp');

        const elBxp = document.getElementById('val-bxp');
        const elBxpRate = document.getElementById('rate-bxp');

        const elStops = document.getElementById('val-stops');
        const elStopsRate = document.getElementById('rate-stops');

        const elMoney = document.getElementById('val-money');
        const elMoneyRate = document.getElementById('rate-money');

        const btnReset = document.getElementById('btn-reset');
        const hudEl = document.getElementById('hud');

        // Session Tracking State
        let sessionStartTime = null;

        let startXp = null;
        let currentXp = 0;
        let gainedXp = 0;
        let stopCount = 0;

        // Net BXP Tracking
        let startBxp = null;
        let currentBxp = 0;
        let netBxp = 0;

        // Cumulative positive Money tracking
        let lastWallet = null;
        let totalCashEarned = 0;

        function sendTycoon(payload) {
            window.postMessage(payload, "*");
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, "*");
            }
        }

        // Prevent focus locking on mousedown
        btnReset.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        // Reset Handler
        btnReset.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // Re-anchor baselines to latest readouts
            if (currentXp > 0) startXp = currentXp;
            if (currentBxp !== null) startBxp = currentBxp;

            // Reset deltas
            gainedXp = 0;
            netBxp = 0;
            totalCashEarned = 0;
            stopCount = 0;

            // Defer timer until the next completed stop
            sessionStartTime = null;
            elTimer.textContent = "00:00:00";

            // Reset DOM displays
            elXp.textContent = "0";
            elXpRate.textContent = "0/h";
            elBxp.textContent = "0";
            elBxpRate.textContent = "0/h";
            elStops.textContent = "0";
            elStopsRate.textContent = "0/h";
            elMoney.textContent = "0";
            elMoneyRate.textContent = "0/h";

            // Strip browser focus and return control to the game
            btnReset.blur();
            if (document.activeElement) document.activeElement.blur();
            window.focus();
            sendTycoon({ type: "pin" });
        });

        // Universal Escape recovery
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.keyCode === 27) {
                if (document.activeElement) document.activeElement.blur();
                window.focus();
                sendTycoon({ type: 'pin' });
            }
        });

        // Strict 1-bit binary rasterizer for CV templates
        function renderBinarizedText(ctx, canvas, text) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 44px Consolas, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, w / 2, h / 2);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const val = (data[i] + data[i + 1] + data[i + 2]) / 3 > 128 ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Initialize coordinate displays
        renderBinarizedText(ctxX, canvasX, "10000");
        renderBinarizedText(ctxY, canvasY, "10000");

        // Initial handshake
        setTimeout(() => {
            sendTycoon({ type: "pin" });
            sendTycoon({ type: "getData" });
        }, 300);

        // Targeted polling with dedicated inventory request
        setInterval(() => {
            try {
                sendTycoon({ 
                    type: "getNamedData", 
                    keys: [
                        JOB_EXP_KEY, 
                        JOB_BXP_KEY, 
                        "inventory", 
                        "wallet", 
                        "pos_x", 
                        "pos_y"
                    ] 
                });
                sendTycoon({ type: "getData" });
            } catch (e) {}
        }, 1000);

        // Clock & Hourly Rates Loop
        function updateHourlyRatesAndTimer() {
            if (!sessionStartTime) return;

            const elapsedMs = Date.now() - sessionStartTime;
            const totalSec = Math.floor(elapsedMs / 1000);

            // Format HH:MM:SS
            const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSec % 60).padStart(2, '0');
            elTimer.textContent = `${hrs}:${mins}:${secs}`;

            const elapsedHours = elapsedMs / 3600000;
            if (elapsedHours <= 0) return;

            // XP/h
            const xpHour = gainedXp / elapsedHours;
            elXpRate.textContent = formatCompact(xpHour) + "/h";

            // BXP/h (reflects net hourly shift, e.g. -400/h or 600/h)
            const bxpHour = netBxp / elapsedHours;
            elBxpRate.textContent = formatCompact(bxpHour) + "/h";

            // Stops/h
            const stopsHour = Math.round(stopCount / elapsedHours);
            elStopsRate.textContent = stopsHour + "/h";

            // Money/h
            const moneyHour = totalCashEarned / elapsedHours;
            elMoneyRate.textContent = formatCompact(moneyHour) + "/h";
        }
        setInterval(updateHourlyRatesAndTimer, 1000);

        window.addEventListener('message', (event) => {
            let msg = event.data;

            if (typeof msg === 'string') {
                try { msg = JSON.parse(msg); } catch (e) { return; }
            }

            if (!msg) return;
            const payload = (msg.type === 'data' && msg.data) ? msg.data : (msg.data ? msg.data : msg);

            if (payload.hidden !== undefined) {
                hudEl.style.display = payload.hidden ? 'none' : 'flex';
            }

            // 1. Coordinates (Zero-latency)
            const posX = payload.pos_x !== undefined ? Number(payload.pos_x) : null;
            const posY = payload.pos_y !== undefined ? Number(payload.pos_y) : null;

            if (posX !== null && posY !== null) {
                const displayX = String(Math.round(posX + COORD_OFFSET)).padStart(5, '0');
                const displayY = String(Math.round(posY + COORD_OFFSET)).padStart(5, '0');

                renderBinarizedText(ctxX, canvasX, displayX);
                renderBinarizedText(ctxY, canvasY, displayY);
            }

            // 2. Cash Earned (Cumulative positive gains only)
            if (payload.wallet !== undefined) {
                const currentWallet = Number(payload.wallet);
                if (lastWallet !== null) {
                    const delta = currentWallet - lastWallet;
                    if (delta > 0) {
                        totalCashEarned += delta;
                        elMoney.textContent = formatCompact(totalCashEarned);
                        updateHourlyRatesAndTimer();
                    }
                }
                lastWallet = currentWallet;
            }

            // 3. XP & Stop Counting (Starts timer on stop 1)
            const rawXp = payload[JOB_EXP_KEY];
            if (typeof rawXp === 'number' && rawXp > 0) {
                if (startXp === null) {
                    startXp = rawXp;
                    currentXp = rawXp;
                } else if (rawXp > currentXp) {
                    stopCount++;
                    currentXp = rawXp;
                    elStops.textContent = String(stopCount);

                    if (sessionStartTime === null) {
                        sessionStartTime = Date.now();
                    }

                    gainedXp = currentXp - startXp;
                    elXp.textContent = formatCompact(gainedXp);
                    updateHourlyRatesAndTimer();
                } else if (rawXp < currentXp) {
                    currentXp = rawXp;
                }
            }

            // 4. BXP Tokens (Net Balance Tracking: Gain 200, Spend 1000 -> -800)
            let rawBxp = payload[JOB_BXP_KEY];
            if ((rawBxp === undefined || rawBxp === null) && payload.inventory) {
                try {
                    let inv = (typeof payload.inventory === 'string') ? JSON.parse(payload.inventory) : payload.inventory;
                    if (inv && inv[JOB_BXP_KEY] !== undefined) {
                        rawBxp = inv[JOB_BXP_KEY];
                    }
                } catch (e) {}
            }

            if (rawBxp !== undefined && rawBxp !== null) {
                let bxpNum = (typeof rawBxp === 'object') ? Number(rawBxp.amount) : Number(rawBxp);
                if (!isNaN(bxpNum)) {
                    currentBxp = bxpNum;

                    // Establish true initial baseline token balance
                    if (startBxp === null) {
                        startBxp = bxpNum;
                    }

                    // Net balance calculation
                    netBxp = currentBxp - startBxp;
                    elBxp.textContent = formatCompact(netBxp);
                    updateHourlyRatesAndTimer();
                }
            }
        });
    </script>
</body>
</html>
